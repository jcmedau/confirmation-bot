spring.application.name=confirmation-bot
application.version=0.0.10
spring-boot.version=4.1.1

# Google Calendar
google.calendar.credentials-path=/app/credentials/service-account.json
google.calendar.calendar-id=agenda.larissarosolen@gmail.com
google.calendar.lookahead-hours=48
google.calendar.application-name=confirmation-bot
google.calendar.schedule-cron=0 0 8 * * *

# Evolution WhatsApp API
evolution.base-url=http://evolution_api:8080
evolution.instance=Amanda
evolution.api-key=C51590AAEEC4-44CA-860A-8D32F5D97D1E

# Hours to wait for a patient reply before sending a reminder
app.notification.waiting-hours=3
# Time of day (HH:mm, in app.timezone) to send first and second confirmation sweeps
app.notification.morning-time=09:00
app.notification.afternoon-time=14:00

# Message templates — placeholders: {nome}, {data}, {hora}
app.messages.confirmation=Ola {nome}! Voce tem uma consulta agendada dia {data} as {hora} coma Dra. Larissa Rosolen.\n\nPor favor, responda com:\n*1* - Confirmar\n*2* - Reagendar\n*3* - Cancelar
app.messages.thanks=Obrigado, {nome}! Sua consulta foi confirmada. Obrigada!
app.messages.reschedule=Entendido, {nome}. Entraremos em contato para reagendar sua consulta. Obrigada.
app.messages.cancellation=Entendido, {nome}. Sua consulta foi cancelada. Se desejar agendar novamente, entre em contato conosco. Obrigada.
app.messages.no-answer-retry=Ola {nome}! Ainda nao recebemos sua confirmacao para a consulta do dia {data} as {hora} com a Dra. Larissa Rosolen.\n\nPor favor, responda:\n*1* - Confirmar\n*2* - Reagendar\n*3* - Cancelar
app.messages.invalid-option=Opcao invalida. Por favor, responda com:\n*1* - Confirmar\n*2* - Reagendar\n*3* - Cancelar

# Jackson — ignore unknown fields in webhook payloads
spring.jackson.deserialization.fail-on-unknown-properties=false

# Webhook URL that Evolution API should call for incoming messages
evolution.webhook-callback-url=http://appointment-bot:8080/webhook/evolution
# Manual trigger endpoint
app.trigger.key=TriggerSkyPower2026
# Timezone for all message formatting (IANA zone ID)
app.timezone=America/Sao_Paulo
