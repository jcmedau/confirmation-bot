services:
  appointment-bot:
    image: confirmation-bot:latest
    container_name: appointment-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./credentials/service-account.json:/app/credentials/service-account.json:ro
    environment:
      - TZ=America/Sao_Paulo
      - EVOLUTION_API_KEY=C51590AAEEC4-44CA-860A-8D32F5D97D1E
      - EVOLUTION_INSTANCE=Amanda
      - EVOLUTION_BASE_URL=http://messages.skypower-aviation.com
